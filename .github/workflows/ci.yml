name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Package contains only dist, README, LICENSE and package.json
        run: |
          npm pack --dry-run --json | jq -r '.[0].files[].path' | sort > packed.txt
          cat packed.txt
          ! grep -vE '^(dist/|README.md$|LICENSE$|package.json$)' packed.txt
